<!doctype html><meta charset="utf-8"><pre id="result">pending</pre><canvas id="c" width="4" height="4"></canvas><script>
try {
 const gl=document.getElementById('c').getContext('webgl2');
 if(!gl) throw Error('No WebGL2 context');
 const ext=gl.getExtension('WEBGL_debug_renderer_info');
 gl.clearColor(1,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 const pixel=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
 document.getElementById('result').textContent=JSON.stringify({renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),pixel:Array.from(pixel)});
} catch(e) {document.getElementById('result').textContent=JSON.stringify({error:String(e)});}
</script>
