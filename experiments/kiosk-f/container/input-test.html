<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiosk Eingabetest</title><style>body{font:28px system-ui;background:#102332;color:#e6f4ff;padding:5vw}h1{font-size:48px}button,input{font:inherit;padding:24px;border-radius:12px;border:2px solid #67d9be;margin:12px;background:#e8fff8;color:#123}#area{padding:50px;border:2px dashed #67d9be;touch-action:none}p{max-width:1000px}small{color:#a9bac8}</style><h1>ROCK · Kiosk-Test</h1><p>Lokaler Vollbildbrowser im VyOS-Container</p><button id="b">Hier klicken oder antippen</button><span id="count">0 Betätigungen</span><p><input placeholder="Tastatur hier testen" aria-label="Tastaturtest"></p><div id="area">Maus oder Finger hier bewegen: <span id="event">Noch keine Eingabe</span></div><p><small>Diese lokale Testseite prüft Eingaben. Später wird hier die konfigurierte Kunden-URL angezeigt.</small></p><script>let n=0;document.querySelector('#b').onclick=()=>document.querySelector('#count').textContent=++n+' Betätigungen';document.querySelector('#area').onpointermove=e=>document.querySelector('#event').textContent=e.pointerType+' · '+Math.round(e.clientX)+', '+Math.round(e.clientY);</script></html>
