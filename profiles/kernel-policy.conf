# Generic Kconfig policy

# Drivers required before rootfs mount should preferably be built-in.
BOOT_CRITICAL_MODE=y

# Normal runtime drivers should preserve the VyOS default whenever possible.
RUNTIME_MODE=preserve

# Never enable COMPILE_TEST to satisfy a real hardware dependency.
ALLOW_COMPILE_TEST=no

# Automatically follow Kconfig "select".
FOLLOW_SELECT=yes

# Do not blindly choose one side of ambiguous A || B dependencies.
AUTO_RESOLVE_OR=no
