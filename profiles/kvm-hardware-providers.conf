# board|provider|kernel_config|ready_config|capture_backend|hid_gadget|dt_overlay|kernel_patch_dir
#
# Exact board identifiers win. The wildcard deliberately provides only the
# generic V4L2/UVC userspace path: SoC family names are not sufficient proof
# that an HDMI-RX connector or an OTG-capable USB port is physically routed.
#
# dt_overlay is optional and is applied only to the final board DTB. This lets
# an exact-board KVM provider change hardware routing without modifying the
# generic kernel source or assuming that SoC-level wiring is identical.
rock-5b|rk3588-synopsys-hdmirx|profiles/base-hardware/rock-5b.config|profiles/base-hardware/rock-5b-ready.config|rk3588-hdmirx+generic-v4l2|yes||profiles/base-hardware/kernel-patches/rk3588-synopsys-hdmirx
orangepi5-plus|rk3588-synopsys-hdmirx|profiles/base-hardware/rock-5b.config|profiles/base-hardware/rock-5b-ready.config|rk3588-hdmirx+generic-v4l2|runtime|profiles/kvm-hardware/dt-overlays/orangepi5-plus-mpp.dts|profiles/base-hardware/kernel-patches/rk3588-synopsys-hdmirx
raspberry-pi-5|pi5-usbc|profiles/base-hardware/raspberry-pi-5.config|profiles/base-hardware/raspberry-pi-5-ready.config|generic-v4l2|runtime|profiles/kvm-hardware/dt-overlays/pi5-usbc-peripheral.dts|
*|generic-v4l2|||generic-v4l2|runtime||
