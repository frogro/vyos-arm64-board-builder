# Generic boot-media policy.
#
# Board-specific host/controller drivers come from the DTB.
# Generic endpoint/infrastructure symbols needed before rootfs mount
# are declared here.

[sd]
required_classes=mmc
endpoint_symbols=CONFIG_MMC_BLOCK

[emmc]
required_classes=mmc
endpoint_symbols=CONFIG_MMC_BLOCK

[nvme]
required_classes=pci,pcie
endpoint_symbols=CONFIG_BLK_DEV_NVME

[usb]
required_classes=usb-host,usb-phy
endpoint_symbols=CONFIG_SCSI,CONFIG_USB_STORAGE,CONFIG_USB_XHCI_HCD,CONFIG_USB_EHCI_HCD,CONFIG_USB_OHCI_HCD,CONFIG_USB_DWC3
