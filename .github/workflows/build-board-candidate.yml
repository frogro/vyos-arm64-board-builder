name: Build VyOS ARM64 board candidate

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Armbian board identifier"
        required: true
        default: "rock-5b"
        type: string

      branch:
        description: "Armbian hardware reference branch"
        required: true
        default: "current"
        type: string

      boot_branch:
        description: "Bootloader reference branch or auto"
        required: true
        default: "auto"
        type: string

      armbian_ref:
        description: "Exact Armbian build branch, tag or commit"
        required: true
        default: "main"
        type: string

      raw_run_id:
        description: "Successful VyOS ARM64 raw workflow run"
        required: true
        default: "32008814114"
        type: string

      publish_release:
        description: "Publish successful build as GitHub Latest Release"
        required: true
        default: true
        type: boolean

jobs:
  board-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    permissions:
      actions: read
      contents: write

    env:
      BOARD: ${{ inputs.board }}
      HW_BRANCH: ${{ inputs.branch }}
      BOOT_BRANCH: ${{ inputs.boot_branch }}
      VYOS_BRANCH: rolling
      ARMBIAN_REF: ${{ inputs.armbian_ref }}
      JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show initial disk space
        run: df -h

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            binutils \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            libxtables-dev \
            iptables \
            pkg-config \
            device-tree-compiler \
            python3 \
            rsync \
            kmod \
            curl \
            gnupg2 \
            patch \
            xz-utils \
            zstd \
            squashfs-tools \
            dosfstools \
            e2fsprogs \
            gdisk \
            parted \
            dpkg-dev \
            initramfs-tools-core \
            coreutils \
            findutils

          uname -a
          dpkg --print-architecture
          df -h

      - name: Build board-specific official VyOS kernel
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build.sh
          ./build.sh

          echo
          echo "===== KERNEL RELEASE ====="
          cat "work/build/${BOARD}/artifacts/kernel.release"

          echo
          echo "===== FINAL KERNEL CONFIG ====="
          CONFIG="work/build/${BOARD}/artifacts/kernel.config"
          test -s "${CONFIG}"

          printf 'Config lines: '
          wc -l < "${CONFIG}"

          sha256sum "${CONFIG}"

          grep -E \
            '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG|CONFIG_MODULE_COMPRESS)=' \
            "${CONFIG}" \
            || true

          df -h

      - name: Prepare firmware provider
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            tools/prepare-firmware.sh \
            tools/resolve-firmware-provider.sh \
            tools/select-uboot-branch.sh \
            tools/resolve-bootchain.sh

          ./tools/prepare-firmware.sh \
            "${BOARD}" \
            "${HW_BRANCH}" \
            "${BOOT_BRANCH}" \
            auto

          echo
          echo "===== BOOT / FIRMWARE MANIFEST ====="
          cat "work/build/${BOARD}/boot/boot-manifest.env"

          echo
          echo "===== PROVIDER SUMMARY ====="

          # shellcheck disable=SC1090
          source "work/build/${BOARD}/boot/boot-manifest.env"

          echo "Provider:         ${FIRMWARE_PROVIDER}"
          echo "Layout:           ${FIRMWARE_LAYOUT_MODE}"
          echo "Boot branch:      ${BOOT_BRANCH}"
          echo "EFI start sector: ${EFI_START_SECTOR}"

          if [[ -d "work/build/${BOARD}/boot/artifacts" ]]; then
            find "work/build/${BOARD}/boot/artifacts" \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n' \
              | sort
          fi

          df -h

      - name: Remove kernel build intermediates
        shell: bash
        run: |
          set -euo pipefail

          find "work/build/${BOARD}" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name artifacts \
            ! -name modules \
            ! -name boot \
            -exec rm -rf {} +

          rm -rf cache/linux-vyos
          rm -rf cache/vyos-build
          rm -rf cache/armbian-build

          df -h

      - name: Download successful VyOS ARM64 raw image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p work/raw-artifact

          gh run download "${{ inputs.raw_run_id }}" \
            --repo "${{ github.repository }}" \
            --name vyos-arm64-raw \
            --dir work/raw-artifact

          find work/raw-artifact \
            -type f \
            -printf '%p %s bytes\n'

          df -h

      - name: Assemble VyOS board image
        shell: bash
        run: |
          set -euo pipefail

          RAW="$(
            find work/raw-artifact \
              -type f \
              -name '*.raw' \
              -print \
              -quit
          )"

          [[ -n "${RAW}" ]]
          test -s "${RAW}"

          sudo \
            ./tools/assemble-board-image.sh \
              "${BOARD}" \
              "${HW_BRANCH}" \
              "${RAW}" \
              "work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          sudo chown "$(id -u):$(id -g)" \
            "work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          df -h

      - name: Show final image layout
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          sudo fdisk -l "$IMAGE"
          sudo sgdisk -v "$IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

      - name: Release raw workspace before compression
        shell: bash
        run: |
          rm -rf work/raw-artifact
          df -h

      - name: Compress board image
        run: |
          xz \
            -T0 \
            -3 \
            -f \
            "work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          sha256sum \
            "work/build/${BOARD}/vyos-${BOARD}-candidate.img.xz" \
            > "work/build/${BOARD}/vyos-${BOARD}-candidate.img.xz.sha256"

      - name: Upload board candidate
        uses: actions/upload-artifact@v4
        with:
          name: vyos-${{ inputs.board }}-${{ inputs.branch }}-candidate
          path: |
            work/build/${{ inputs.board }}/vyos-${{ inputs.board }}-candidate.img.xz
            work/build/${{ inputs.board }}/vyos-${{ inputs.board }}-candidate.img.xz.sha256
            work/build/${{ inputs.board }}/artifacts/kernel.release
            work/build/${{ inputs.board }}/artifacts/kernel.config
            work/build/${{ inputs.board }}/boot/boot-manifest.env
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ./tools/create-release-notes.sh \
            "${BOARD}" \
            "work/build/${BOARD}"

          # shellcheck disable=SC1090
          source "work/build/${BOARD}/boot/boot-manifest.env"

          DATE="$(date -u +%Y.%m.%d)"
          TAG="${DATE}-${BOARD}-test-${GITHUB_RUN_NUMBER}"

          echo "Release tag: $TAG"
          echo "Release board: $BOARD_NAME"

          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "VyOS ARM64 ${BOARD_NAME} test image" \
            --notes-file "work/build/${BOARD}/RELEASE_NOTES.md" \
            --latest \
            "work/build/${BOARD}/vyos-${BOARD}-candidate.img.xz" \
            "work/build/${BOARD}/vyos-${BOARD}-candidate.img.xz.sha256" \
            "work/build/${BOARD}/artifacts/kernel.release" \
            "work/build/${BOARD}/artifacts/kernel.config" \
            "work/build/${BOARD}/boot/boot-manifest.env"
