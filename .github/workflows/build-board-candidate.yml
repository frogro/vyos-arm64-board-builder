name: Recover validated Pi 5 release artifacts
run-name: Recover Pi 5 artifacts from run 35464528782 (no rebuild)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e24a9f11685eaa3e2ec11d81183f0c2556095f3c
      - name: Verify source run and retrieve validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35464528782" > /tmp/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35464528782/jobs" > /tmp/source-jobs.json
          python3 - <<'PY'
          import json
          run=json.load(open('/tmp/source-run.json'))
          assert run['head_sha']=='e24a9f11685eaa3e2ec11d81183f0c2556095f3c'
          assert run['status']=='completed' and run['conclusion']=='failure'
          jobs=json.load(open('/tmp/source-jobs.json'))['jobs']
          failed=[s['name'] for j in jobs for s in j['steps'] if s['conclusion']=='failure']
          assert failed==['Publish GitHub release'], failed
          PY
          gh run download 35464528782 --repo "$GITHUB_REPOSITORY" \
            --name vyos-raspberry-pi-5-current-candidate --dir work/build/raspberry-pi-5
          cd work/build/raspberry-pi-5
          sha256sum -c ./*.sha256
          python3 - <<'PY'
          import json
          m=json.load(open('board-manifest.json'))
          assert (m['board'],m['profile'],m['architecture'],m['update_provider'])==('raspberry-pi-5','network','arm64','firmware-files')
          PY
      - name: Publish recovered test release without replacing old assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          ROLLING_REFERENCE: 2026.09.17-0028-rolling
        run: |
          set -euo pipefail
          ROOT=work/build/raspberry-pi-5
          TAG=2026.09.19-1637-selfbuilt-raspberry-pi-5-network-run-35464528782
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Recovery release already exists; refusing to overwrite'; exit 1
          fi
          printf '\nRELEASE_TAG=%s\n' "$TAG" >> "$ROOT/release.env"
          ./tools/create-release-notes.sh raspberry-pi-5 "$ROOT"
          python3 - "$ROOT/RELEASE_NOTES.md" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); text=p.read_text()
          marker='The release includes a VyOS system-image ISO, but native Raspberry Pi firmware boots'
          start=text.find(marker)
          if start>=0:
              end=text.index('\n\n',start)
              text=text[:start]+'Experimental FAT boot-file synchronization and image-switch hooks are included. They passed automated checks but still require Raspberry Pi 5 hardware validation. No public update feed is enabled; use the initial-installation image for hardware testing.'+text[end:]
          text+='\n\n## Recovered publication\n\nImage files are unchanged artifacts from workflow run 35464528782, builder commit e24a9f11685eaa3e2ec11d81183f0c2556095f3c. All image-build steps succeeded; publication alone failed because the base-version release tag already existed. This separate tag preserves the older release. The internal VyOS version remains 999.202609191637; this is a fresh-installation test candidate, not a newer-version update.\n'
          p.write_text(text)
          PY
          source "$ROOT/release.env"
          assets=(
            "$ROOT/$RELEASE_BASENAME.img.xz" "$ROOT/$RELEASE_BASENAME.img.xz.sha256"
            "$ROOT/$RELEASE_BASENAME.iso" "$ROOT/$RELEASE_BASENAME.iso.sha256"
            "$ROOT/release.env" "$ROOT/board-manifest.json"
            "$ROOT/artifacts/kernel.release" "$ROOT/artifacts/kernel.config"
            "$ROOT/artifacts/network-firmware/extended-network-report.txt"
            "$ROOT/artifacts/network-firmware/network-firmware-manifest.json"
            "$ROOT/artifacts/network-firmware/required-firmware.txt"
            "$ROOT/artifacts/network-firmware/installed-firmware.txt"
            "$ROOT/artifacts/network-firmware/missing-firmware.txt"
            "$ROOT/boot/boot-manifest.env" "$ROOT/selection/feature-profile.json"
            "$ROOT/selection/kvm-hardware.json"
          )
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target e24a9f11685eaa3e2ec11d81183f0c2556095f3c \
            --title "VyOS $VYOS_VERSION for Raspberry Pi 5 — revised test image" \
            --notes-file "$ROOT/RELEASE_NOTES.md" "${assets[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          ./tools/publish-board-release.sh raspberry-pi-5 "$ROOT"
