name: Build VyOS ARM64 board candidate

on:
  # Creating a deliberately named test branch is the non-interactive CI entry
  # point. Ordinary pushes to development branches never publish images.
  push:
    branches:
      - "pi5-test-*"

  workflow_dispatch:
    inputs:
      board:
        description: "Armbian board identifier"
        required: true
        default: "rock-5b"
        type: string

      hardware_reference:
        description: "Developer override (normal builds use auto)"
        required: true
        default: "auto"
        type: string

      extended_network:
        description: "Include curated additional Wi-Fi/Ethernet/WWAN support"
        required: true
        default: false
        type: boolean

      armbian_ref:
        description: "Exact Armbian build branch, tag or commit"
        required: true
        default: "main"
        type: string

      raw_run_id:
        description: "Successful VyOS ARM64 raw workflow run"
        required: true
        default: "32008814114"
        type: string

      publish_release:
        description: "Publish successful build as GitHub Latest Release"
        required: true
        default: true
        type: boolean

jobs:
  board-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    permissions:
      actions: read
      contents: write

    env:
      BOARD: ${{ inputs.board || 'raspberry-pi-5' }}
      HW_REFERENCE: ${{ inputs.hardware_reference || 'auto' }}
      EXTENDED_NETWORK: ${{ inputs.extended_network || false }}
      BOOT_BRANCH: auto
      VYOS_BRANCH: rolling
      ARMBIAN_REF: ${{ inputs.armbian_ref || '9de7be05323564424cf64171cb483712ec356bc1' }}
      RAW_RUN_ID: ${{ inputs.raw_run_id || '32008814114' }}
      JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test DT boot-driver discovery
        run: |
          python3 tests/test-dtb-boot-roots.py
          python3 tests/test-early-of-declarations.py
          python3 tests/test-config-validation.py
          python3 tests/test-model-requirements.py
          python3 tests/test-grub-console-default.py
          bash tests/test-common-firstboot.sh
          python3 tests/test-extended-network-profile.py
          python3 tests/test-release-identity.py
          python3 tests/test-arm-cpu-opmode.py
          bash tests/test-extended-network-selection.sh
          bash tests/test-extended-network-resolver.sh
          bash tests/test-network-firmware.sh

      - name: Show initial disk space
        run: df -h

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            binutils \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            libxtables-dev \
            iptables \
            pkg-config \
            device-tree-compiler \
            python3 \
            rsync \
            kmod \
            curl \
            gnupg2 \
            patch \
            xz-utils \
            zstd \
            squashfs-tools \
            xorriso \
            dosfstools \
            e2fsprogs \
            gdisk \
            parted \
            dpkg-dev \
            initramfs-tools-core \
            coreutils \
            findutils

          uname -a
          dpkg --print-architecture
          df -h

      - name: Test Raspberry Pi firmware provider
        run: bash tests/test-raspberrypi-provider.sh

      - name: Build board-specific official VyOS kernel
        id: kernel
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build.sh
          ./build.sh

          # The builder resolved these values from the real VyOS kernel.
          # Export them for the provider and image-assembly stages.
          source "work/build/${BOARD}/selection/selected-reference.env"
          for name in \
            ARMBIAN_BOARD \
            BOARD_MODEL \
            BOARD_NAME_OVERRIDE \
            BOARD_SOC_OVERRIDE \
            BOOT_FDT_FILE_OVERRIDE \
            FIRMWARE_PROVIDER_OVERRIDE \
            HW_BRANCH \
            HW_SELECTION_MODE \
            VYOS_KERNEL_VERSION \
            VYOS_KERNEL_MAJOR_MINOR \
            REFERENCE_KERNEL_MAJOR_MINOR
          do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          echo "hw_branch=${HW_BRANCH}" >> "$GITHUB_OUTPUT"

          echo
          echo "===== KERNEL RELEASE ====="
          cat "work/build/${BOARD}/artifacts/kernel.release"

          echo
          echo "===== FINAL KERNEL CONFIG ====="
          CONFIG="work/build/${BOARD}/artifacts/kernel.config"
          test -s "${CONFIG}"

          printf 'Config lines: '
          wc -l < "${CONFIG}"

          sha256sum "${CONFIG}"

          grep -E \
            '^(CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG|CONFIG_MODULE_COMPRESS)=' \
            "${CONFIG}" \
            || true

          df -h

      - name: Prepare firmware provider
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            tools/prepare-firmware.sh \
            tools/resolve-firmware-provider.sh \
            tools/select-uboot-branch.sh \
            tools/resolve-bootchain.sh

          ./tools/prepare-firmware.sh \
            "${BOARD}" \
            "${HW_BRANCH}" \
            "${BOOT_BRANCH}" \
            auto

          echo
          echo "===== BOOT / FIRMWARE MANIFEST ====="
          cat "work/build/${BOARD}/boot/boot-manifest.env"

          echo
          echo "===== PROVIDER SUMMARY ====="

          # shellcheck disable=SC1090
          source "work/build/${BOARD}/boot/boot-manifest.env"

          echo "Provider:         ${FIRMWARE_PROVIDER}"
          echo "Layout:           ${FIRMWARE_LAYOUT_MODE}"
          echo "Boot branch:      ${BOOT_BRANCH}"
          echo "EFI start sector: ${EFI_START_SECTOR}"

          if [[ -d "work/build/${BOARD}/boot/artifacts" ]]; then
            find "work/build/${BOARD}/boot/artifacts" \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n' \
              | sort
          fi

          df -h

      - name: Remove kernel build intermediates
        shell: bash
        run: |
          set -euo pipefail

          find "work/build/${BOARD}" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name artifacts \
            ! -name modules \
            ! -name boot \
            ! -name selection \
            -exec rm -rf {} +

          sudo rm -rf cache/linux-vyos
          sudo rm -rf cache/vyos-build
          sudo rm -rf cache/armbian-build
          sudo rm -rf cache/linux-firmware

          df -h

      - name: Download successful VyOS ARM64 raw image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p work/raw-artifact

          gh run download "${RAW_RUN_ID}" \
            --repo "${{ github.repository }}" \
            --name vyos-arm64-raw \
            --dir work/raw-artifact

          find work/raw-artifact \
            -type f \
            -printf '%p %s bytes\n'

          df -h

      - name: Assemble VyOS board image
        shell: bash
        run: |
          set -euo pipefail

          RAW="$(
            find work/raw-artifact \
              -type f \
              -name '*.raw' \
              -print \
              -quit
          )"

          [[ -n "${RAW}" ]]
          test -s "${RAW}"

          sudo \
            ./tools/assemble-board-image.sh \
              "${BOARD}" \
              "${HW_BRANCH}" \
              "${RAW}" \
              "work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          sudo chown "$(id -u):$(id -g)" \
            "work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          df -h

      - name: Create VyOS system-image update ISO
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            tools/create-system-image-iso.sh \
            tools/release-identity.py

          sudo \
            ./tools/create-system-image-iso.sh \
              "${BOARD}" \
              "work/build/${BOARD}/vyos-${BOARD}-candidate.img" \
              "work/build/${BOARD}"

          sudo chown -R "$(id -u):$(id -g)" \
            "work/build/${BOARD}"

          cat "work/build/${BOARD}/release.env" >> "$GITHUB_ENV"

          # shellcheck disable=SC1090
          source "work/build/${BOARD}/release.env"

          echo "Release tag:      ${RELEASE_TAG}"
          echo "Release basename: ${RELEASE_BASENAME}"
          echo "Update provider:  ${UPDATE_PROVIDER}"

          ls -lh \
            "work/build/${BOARD}/${RELEASE_BASENAME}.iso" \
            "work/build/${BOARD}/${RELEASE_BASENAME}.iso.sha256"

      - name: Show final image layout
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          sudo fdisk -l "$IMAGE"
          sudo sgdisk -v "$IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

      - name: Release raw workspace before compression
        shell: bash
        run: |
          rm -rf work/raw-artifact
          df -h

      - name: Compress board image
        shell: bash
        run: |
          set -euo pipefail

          xz \
            -T0 \
            -3 \
            -c \
            "work/build/${BOARD}/vyos-${BOARD}-candidate.img" \
            > "work/build/${BOARD}/${RELEASE_BASENAME}.img.xz"

          rm -f "work/build/${BOARD}/vyos-${BOARD}-candidate.img"

          (
            cd "work/build/${BOARD}"
            sha256sum "${RELEASE_BASENAME}.img.xz" \
              > "${RELEASE_BASENAME}.img.xz.sha256"
          )

      - name: Upload board candidate
        uses: actions/upload-artifact@v4
        with:
          name: vyos-${{ env.BOARD }}-${{ steps.kernel.outputs.hw_branch }}-candidate
          path: |
            work/build/${{ env.BOARD }}/vyos-*.img.xz
            work/build/${{ env.BOARD }}/vyos-*.img.xz.sha256
            work/build/${{ env.BOARD }}/vyos-*.iso
            work/build/${{ env.BOARD }}/vyos-*.iso.sha256
            work/build/${{ env.BOARD }}/release.env
            work/build/${{ env.BOARD }}/artifacts/kernel.release
            work/build/${{ env.BOARD }}/artifacts/kernel.config
            work/build/${{ env.BOARD }}/artifacts/network-firmware/*.json
            work/build/${{ env.BOARD }}/artifacts/network-firmware/*.txt
            work/build/${{ env.BOARD }}/boot/boot-manifest.env
            work/build/${{ env.BOARD }}/selection/selected-reference.env
            work/build/${{ env.BOARD }}/selection/extended-network.env
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ./tools/create-release-notes.sh \
            "${BOARD}" \
            "work/build/${BOARD}"

          # shellcheck disable=SC1090
          source "work/build/${BOARD}/boot/boot-manifest.env"

          # shellcheck disable=SC1090
          source "work/build/${BOARD}/release.env"

          echo "Release tag: $RELEASE_TAG"
          echo "Release board: $BOARD_NAME"

          if gh release view "$RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "ERROR: release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "VyOS ${VYOS_VERSION} for ${BOARD_NAME}" \
            --notes-file "work/build/${BOARD}/RELEASE_NOTES.md" \
            --latest \
            "work/build/${BOARD}/${RELEASE_BASENAME}.img.xz" \
            "work/build/${BOARD}/${RELEASE_BASENAME}.img.xz.sha256" \
            "work/build/${BOARD}/${RELEASE_BASENAME}.iso" \
            "work/build/${BOARD}/${RELEASE_BASENAME}.iso.sha256" \
            "work/build/${BOARD}/release.env" \
            "work/build/${BOARD}/artifacts/kernel.release" \
            "work/build/${BOARD}/artifacts/kernel.config" \
            "work/build/${BOARD}/artifacts/network-firmware/extended-network-report.txt" \
            "work/build/${BOARD}/artifacts/network-firmware/network-firmware-manifest.json" \
            "work/build/${BOARD}/artifacts/network-firmware/required-firmware.txt" \
            "work/build/${BOARD}/artifacts/network-firmware/installed-firmware.txt" \
            "work/build/${BOARD}/artifacts/network-firmware/missing-firmware.txt" \
            "work/build/${BOARD}/boot/boot-manifest.env"
