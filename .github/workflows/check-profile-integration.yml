name: Check optional profile integration
on:
  push:
    branches: [main]
    paths: ['tools/**', 'profiles/**', 'tests/**', 'experiments/kiosk-f/**', 'experiments/profile-g/**', 'build.sh', '.github/workflows/check-profile-integration.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tabulate python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-bad gstreamer1.0-tools libxml2-utils
      - name: Check isolation, update channels and common fixes
        run: |
          set -euo pipefail
          for test in alsa-restore raw-kernel cli-source-resolution feature-profile multimedia-selection vyos-1x-profile board-update-channel pi-release-publication common-firstboot setup-helpers syslog-start hostname-resolution mpp-patch-compat decoder-patch-compat console-log-source kvm-profile kvm-cli kvm-capture kvm-input-config kvm-local-input tailscale-cli tailscale-bundle image-info orangepi-adfg; do
            if [[ -f tests/test-$test.py ]]; then python3 tests/test-$test.py; else bash tests/test-$test.sh; fi
          done
          sudo python3 tests/test-system-image-config-metadata.py
          sudo python3 tests/test-kvm-media-file-ownership.py
      - name: Check F and G lifecycle behavior
        run: |
          python3 -m unittest discover -s experiments/kiosk-f/tests
          python3 -m unittest discover -s experiments/profile-g/tests
          python3 experiments/kiosk-f/ci/check-cli-recipe.py
      - name: Check CLI combinations against pinned upstream source
        run: python3 experiments/profile-g/ci/check-native-cli.py
