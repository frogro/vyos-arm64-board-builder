name: Test source-built VyOS-1x profile packages
on:
  push:
    branches: [main-test]
    paths:
      - tools/build-vyos-1x-profile.py
      - tools/prepare-vyos-1x-profile.py
      - tools/kvm-cli/**
      - profiles/kvm-cli/**
      - tools/tailscale-cli/**
      - profiles/tailscale-cli/**
      - tools/common-firstboot/vyos-arm64-tailscaled.service
      - tests/test-tailscale-cli.py
      - tools/install-tailscale.py
      - tests/test-tailscale-bundle.py
      - tests/test-vyos-1x-profile.py
      - .github/workflows/test-vyos-1x-profile.yml
  workflow_dispatch:
    inputs:
      base_package_version:
        description: Exact original vyos-1x version from the target raw image
        required: true
        default: 999.0-14891-gd185906f3
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        profile: [kvm, tailscale, kvm-tailscale]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check profile isolation and configuration lifecycle
        run: |
          python3 tests/test-vyos-1x-profile.py
          python3 tests/test-tailscale-cli.py
          python3 tests/test-tailscale-bundle.py
          python3 tests/test-kvm-input-config.py
          python3 tests/test-kvm-capture.py
          python3 tests/test-kvm-local-input.py
          python3 tests/test-kvm-cli.py
      - name: Verify official bundled programs on ARM64
        if: contains(matrix.profile, 'tailscale')
        run: |
          mkdir -p work/tailscale-rootfs/etc
          python3 tools/install-tailscale.py work/tailscale-rootfs
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('work/tailscale-rootfs')
          expected = json.loads((root/'usr/share/vyos-arm64-board-builder/tailscale/build.json').read_text())['version']
          for name in ('tailscale', 'tailscaled'):
              binary = root/'usr/libexec/tailscale'/name
              actual = subprocess.check_output([str(binary), '--version'], text=True, timeout=15).splitlines()[0]
              assert actual == expected, (name, actual, expected)
          help_text = subprocess.check_output([str(root/'usr/libexec/tailscale/tailscale'), 'set', '--help'], text=True, stderr=subprocess.STDOUT, timeout=15)
          for flag in ('--advertise-routes', '--accept-routes', '--snat-subnet-routes', '--netfilter-mode', '--accept-dns', '--auto-update'):
              assert flag in help_text, flag
          print('Both ARM64 executables and all CLI-owned preference flags verified')
          PY
      - name: Build exact-source ARM64 package with upstream targets
        env:
          BASE_PACKAGE_VERSION: ${{ inputs.base_package_version || '999.0-14891-gd185906f3' }}
          CLI_PROFILE: ${{ matrix.profile }}
        run: |
          sudo --preserve-env=BASE_PACKAGE_VERSION,CLI_PROFILE python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('builder', 'tools/build-vyos-1x-profile.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          selected = os.environ['CLI_PROFILE']
          builder.build(os.environ['BASE_PACKAGE_VERSION'], Path('work/vyos-1x-profile').resolve(),
                        kvm='kvm' in selected, tailscale='tailscale' in selected)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vyos-1x-${{ matrix.profile }}-source-build
          path: work/vyos-1x-profile/*
          if-no-files-found: error
