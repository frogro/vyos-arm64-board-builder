name: Test VyOS ARM64 raw image

on:
  workflow_dispatch:
    inputs:
      vyos_ref:
        description: Official VyOS source ref (use the same commit for the board candidate)
        required: false
        default: rolling
        type: string

  workflow_call:
    inputs:
      vyos_ref:
        required: true
        type: string
    outputs:
      raw_run_id:
        description: Run containing the completed raw artifact
        value: ${{ jobs.vyos-arm64-raw.outputs.raw_run_id }}

jobs:
  kernel-package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact VyOS source
        id: source
        env:
          VYOS_REF: ${{ inputs.vyos_ref || 'rolling' }}
        run: |
          set -euo pipefail
          ROOT_DIR="$PWD"
          info() { echo "$*"; }
          die() { echo "$*" >&2; exit 1; }
          source sources/vyos.sh
          vyos_fetch
          echo "commit=$(git -C cache/vyos-build rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test kernel package selection
        run: python3 tests/test-raw-kernel.py
      - name: Check signed repository for exact ARM64 kernel
        id: kernel
        run: |
          sudo --preserve-env=GITHUB_OUTPUT python3 tools/ensure-raw-kernel.py cache/vyos-build \
            --packages work/raw-kernel --metadata work/raw-kernel/kernel-package.json
          sudo chown -R "$(id -u):$(id -g)" work/raw-kernel
      - name: Build native ARM64 toolchain from the selected official source
        if: steps.kernel.outputs.build_required == 'true'
        run: |
          docker build --network host --platform linux/arm64 --build-arg ARCH=arm64v8/ \
            -t vyarm-raw-kernel-builder:local cache/vyos-build/docker
          test "$(docker image inspect --format '{{.Architecture}}' vyarm-raw-kernel-builder:local)" = arm64
      - name: Build missing exact-version kernel with upstream recipe
        if: steps.kernel.outputs.build_required == 'true'
        run: |
          docker run --rm --privileged --user root --entrypoint /bin/bash \
            -v "$PWD/cache/vyos-build:/vyos" \
            -w /vyos/scripts/package-build/linux-kernel vyarm-raw-kernel-builder:local \
            -ec 'git config --global --add safe.directory /vyos; python3 build.py --packages linux-kernel nat-rtsp jool realtek-r8126 realtek-r8152 ipt-netflow --keep-kernel'
          sudo python3 tools/ensure-raw-kernel.py cache/vyos-build --import-built \
            --packages work/raw-kernel --metadata work/raw-kernel/kernel-package.json
          docker image inspect vyarm-raw-kernel-builder:local --format '{{.Id}}' > work/raw-kernel/build-container-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vyos-arm64-raw-kernel
          path: work/raw-kernel/
          if-no-files-found: error

  vyos-arm64-raw:
    needs: kernel-package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      raw_run_id: ${{ github.run_id }}

    steps:
      - name: Checkout board builder
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker info

      - name: Checkout official VyOS build
        env:
          VYOS_REF: ${{ needs.kernel-package.outputs.source_commit }}
        run: |
          set -euo pipefail
          ROOT_DIR="$PWD"
          info() { echo "$*"; }
          die() { echo "$*" >&2; exit 1; }
          source sources/vyos.sh
          vyos_fetch
          mkdir -p work/raw-provenance
          python3 tools/resolve-rolling-base.py --recipe-only > work/raw-provenance/raw-recipe-sha256.txt
          git -C cache/vyos-build rev-parse HEAD > work/raw-provenance/vyos-source-commit.txt
          cp cache/vyos-build/data/defaults.toml work/raw-provenance/vyos-defaults.toml

      - name: Download verified exact-version kernel package
        uses: actions/download-artifact@v4
        with:
          name: vyos-arm64-raw-kernel
          path: cache/vyos-build/packages
      - name: Verify kernel artifact checksum and record provenance
        run: |
          python3 tools/ensure-raw-kernel.py cache/vyos-build --verify-artifact \
            --packages cache/vyos-build/packages --metadata cache/vyos-build/packages/kernel-package.json
          cp cache/vyos-build/packages/kernel-package.json work/raw-provenance/

      - name: Apply ARM64 VyOS raw image patch
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/patch-vyos-arm64-raw.py

          echo "===== PATCHED RAW IMAGE GRUB PATH ====="
          grep -nA25 -B5             'ARM64 target detected'             cache/vyos-build/scripts/image-build/raw_image.py

      - name: Enable ARM64 binfmt
        run: |
          docker run --privileged --rm             tonistiigi/binfmt             --install arm64

          docker run --rm             --platform linux/arm64             alpine             uname -m

      - name: Pull official VyOS build container
        run: |
          docker pull vyos/vyos-build:rolling
          docker image inspect vyos/vyos-build:rolling --format '{{json .RepoDigests}}' > work/raw-provenance/build-container.json

      - name: Configure build swap
        shell: bash
        run: |
          set -euo pipefail

          echo "===== MEMORY BEFORE SWAP ====="
          free -h

          sudo swapoff -a || true
          sudo rm -f /swapfile

          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo
          echo "===== MEMORY AFTER SWAP ====="
          free -h

          echo
          echo "===== ACTIVE SWAP ====="
          swapon --show

      - name: Build official VyOS ARM64 raw image
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --privileged \
            -v "$PWD/cache/vyos-build:/vyos" \
            -v "$PWD/profiles/vyos-flavors:/vyos-custom-flavors:ro" \
            -w /vyos \
            vyos/vyos-build:rolling \
            sudo env \
              VYOS_BUILD_FLAVORS_DIR=/vyos-custom-flavors \
              ./build-vyos-image \
                --architecture arm64 \
                arm64-raw

      - name: Diagnose failed raw build
        if: failure()
        run: |
          free -h
          swapon --show
          df -h
          sudo dmesg | tail -80 || true

      - name: Show generated images
        shell: bash
        run: |
          set -euo pipefail

          echo "===== VYOS BUILD OUTPUT ====="

          find cache/vyos-build \
            -maxdepth 3 \
            -type f \
            \( -name '*.raw' -o -name '*.img' -o -name '*.iso' -o -name '*.xz' \) \
            -printf '%p %s bytes\n' \
            | sort

      - name: Locate raw image
        id: raw
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find cache/vyos-build \
              -maxdepth 3 \
              -type f \
              -name '*.raw' \
              -print \
              | head -1
          )"

          if [[ -z "$IMAGE" ]]; then
            echo "ERROR: no VyOS ARM64 raw image produced"
            exit 1
          fi

          echo "path=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "VyOS ARM64 raw image: $IMAGE"
          ls -lh "$IMAGE"

      - name: Upload VyOS ARM64 raw image
        uses: actions/upload-artifact@v4
        with:
          name: vyos-arm64-raw
          path: ${{ steps.raw.outputs.path }}
          if-no-files-found: error
          compression-level: 1

      - name: Upload raw source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyos-arm64-raw-provenance
          path: work/raw-provenance/
          if-no-files-found: warn
