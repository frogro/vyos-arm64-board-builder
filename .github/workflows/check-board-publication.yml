name: Check board publication access
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify existing release credential can publish to board repositories
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          for board in radxa-e52c rock-5b; do
            gh api "repos/VyARM-Community/$board" --jq '.permissions.push' | grep -qx true
          done
