name: Publish completed ADFG artifacts
on:
  workflow_run:
    workflows: [Build VyOS ARM64 board candidate]
    types: [completed]
  workflow_dispatch:
    inputs:
      rock_run:
        description: Successful ROCK 5B ADFG source run (blank to skip)
        required: false
        type: string
      orangepi_run:
        description: Successful Orange Pi 5 Plus ADFG source run (blank to skip)
        required: false
        type: string
      pi_run:
        description: Successful Pi 5 ADFG source run (blank to skip)
        required: false
        type: string
      e52c_run:
        description: Successful E52C AC source run (blank to skip)
        required: false
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-adfg-artifacts
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(github.event.workflow_run.display_title, 'print-e=true') &&
       contains(github.event.workflow_run.display_title, 'receiver-g=true') &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'test/pi5-e52c-profile-support-20261003'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        board: [rock-5b, orangepi5-plus, raspberry-pi-5, radxa-e52c]
    env:
      GH_TOKEN: ${{ github.token }}
      BOARD: ${{ matrix.board }}
      SOURCE_RUN: ${{ (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.display_title, format('{0} /', matrix.board))) && github.event.workflow_run.id || matrix.board == 'rock-5b' && inputs.rock_run || matrix.board == 'orangepi5-plus' && inputs.orangepi_run || matrix.board == 'raspberry-pi-5' && inputs.pi_run || matrix.board == 'radxa-e52c' && inputs.e52c_run || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and publish verified completed artifacts
        if: env.SOURCE_RUN != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          SHA=$(python3 tools/verify-publish-source.py "$GITHUB_REPOSITORY" "$SOURCE_RUN")
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/artifacts"
          python3 tools/publish-adfg-artifact-release.py "$BOARD" "$SOURCE_RUN" "$SHA" "$RUNNER_TEMP/artifacts"
