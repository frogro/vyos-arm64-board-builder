name: Publish completed ADFG artifacts
on:
  workflow_dispatch:
    inputs:
      rock_run:
        description: Successful ROCK 5B ADFG source run (blank to skip)
        required: false
        type: string
      orangepi_run:
        description: Successful Orange Pi 5 Plus ADFG source run (blank to skip)
        required: false
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-adfg-artifacts
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        board: [rock-5b, orangepi5-plus]
    env:
      GH_TOKEN: ${{ github.token }}
      BOARD: ${{ matrix.board }}
      SOURCE_RUN: ${{ matrix.board == 'rock-5b' && inputs.rock_run || matrix.board == 'orangepi5-plus' && inputs.orangepi_run || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and publish verified completed artifacts
        if: env.SOURCE_RUN != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha > source.json
          SHA=$(python3 -c 'import json; d=json.load(open("source.json")); assert d["conclusion"]=="success"; print(d["headSha"])')
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/artifacts"
          python3 tools/publish-adfg-artifact-release.py "$BOARD" "$SOURCE_RUN" "$SHA" "$RUNNER_TEMP/artifacts"
